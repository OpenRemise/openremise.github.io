<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <script>
    const stored = localStorage.getItem('language');
    if (stored) {
      location.href = stored === 'de' ? 'de/' : 'en/';
    } else {
      location.href = (navigator.language || "").toLowerCase().startsWith("de")
        ? "de/"
        : "en/";
    }
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=en/">
  </noscript>
</head>

</html>
